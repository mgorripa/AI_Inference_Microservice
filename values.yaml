image:
  service: "ai-infer:latest"
  loadgen: "ai-loadgen:latest"
  pullPolicy: IfNotPresent

service:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 2
    readiness:
      initialDelaySeconds: 1
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 60

loadgen:
  enabled: true
  qps: 2
  concurrency: 2
  durationSeconds: 0
  requestTimeoutSeconds: 5
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

serviceMonitor:
  enabled: false
  interval: 15s
