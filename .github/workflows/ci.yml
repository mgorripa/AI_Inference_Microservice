name: CI

on:
  workflow_dispatch:
  
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests and C++ extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            service/requirements.txt
            requirements-dev.txt

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            torch==2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Build and install the C++ extension
        run: |
          python -m pip install ./service/kernels

      - name: Verify code formatting and common errors
        run: |
          ruff check service tests

      # - name: Run tests
      #   run: |
      #     pytest -q --cov=service --cov-report=term-missing
      - name: Run tests
        env:
          # Add the repository root to Python's module search path.
          # This allows imports such as "from service.app import app".
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Using "python -m pytest" ensures pytest uses the same Python
          # environment in which the project dependencies were installed.
          python -m pytest -q --cov=service --cov-report=term-missing

  go-build:
    name: Go load-generator build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-loadgen/go.mod
          cache-dependency-path: go-loadgen/go.sum

      - name: Download Go dependencies
        working-directory: go-loadgen
        run: go mod download

      - name: Format check
        working-directory: go-loadgen
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: go-loadgen
        run: go vet ./...

      - name: Build
        working-directory: go-loadgen
        run: go build ./...

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [python-tests, go-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build inference-service image
        run: |
          docker build \
            --file Dockerfile.service \
            --tag ai-infer-service:ci \
            .

      - name: Build load-generator image
        run: |
          docker build \
            --file Dockerfile.loadgen \
            --tag ai-loadgen:ci \
            .
